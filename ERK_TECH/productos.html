<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Productos - ERK TECH</title>

    <link rel="stylesheet" href="css/estilos.css">
</head>

<body>

    <header>
        <div class="container">
            <h1>ERK TECH</h1>
            <p>Gestión de productos</p>
        </div>
    </header>

    <nav id="menu">
        <a href="dashboard.html" class="enlace">Inicio</a>
        <a href="productos.html" class="enlace">Productos</a>
        <a href="componentes.html" class="enlace">Componentes</a>
    </nav>

    <main class="container">

        <!-- FORMULARIO -->
        <section>
            <h2>Registrar producto</h2>

            <form id="form-producto" class="product-form" novalidate>

                <div class="form-group">
                    <label for="nombre">Nombre del producto</label>

                    <input
                        type="text"
                        id="nombre"
                        name="nombre"
                        minlength="3"
                        required
                        aria-describedby="error-nombre"
                    >

                    <small id="error-nombre" class="mensaje-error"></small>
                </div>

                <div class="form-group">
                    <label for="categoria">Categoría</label>

                    <select
                        id="categoria"
                        name="categoria"
                        required
                        aria-describedby="error-categoria"
                    >
                        <option value="">Seleccione una categoría</option>
                        <option value="Periféricos">Periféricos</option>
                        <option value="Pantallas">Pantallas</option>
                        <option value="Almacenamiento">Almacenamiento</option>
                        <option value="Componentes">Componentes</option>
                        <option value="Accesorios">Accesorios</option>
                    </select>

                    <small id="error-categoria" class="mensaje-error"></small>
                </div>

                <div class="form-group">
                    <label for="precio">Precio</label>

                    <input
                        type="number"
                        id="precio"
                        name="precio"
                        min="0.01"
                        required
                        aria-describedby="error-precio"
                    >

                    <small id="error-precio" class="mensaje-error"></small>
                </div>

                <div class="form-group">
                    <label for="stock">Stock</label>

                    <input
                        type="number"
                        id="stock"
                        name="stock"
                        min="0"
                        step="1"
                        required
                        aria-describedby="error-stock"
                    >

                    <small id="error-stock" class="mensaje-error"></small>
                </div>

                <button type="submit" class="boton">
                    Registrar producto
                </button>

            </form>
        </section>

        <!-- TABLA -->
        <section>

            <h2>Productos registrados</h2>

            <div class="form-group">
                <label for="buscador">Buscar producto</label>

                <input
                    type="search"
                    id="buscador"
                    name="buscador"
                    placeholder="Buscar por nombre o categoría"
                >
            </div>

            <div class="table-container">

                <table id="tabla-productos">

                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Producto</th>
                            <th>Categoría</th>
                            <th>Precio</th>
                            <th>Stock</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>

                    <tbody>
                        <!-- JavaScript pintará los productos aquí -->
                    </tbody>

                </table>

            </div>

        </section>

    </main>

    <!-- Primero cargamos los datos -->
    <script src="js/datos-prueba.js"></script>

    <!-- Después cargamos la lógica del Día 8 -->
    <script src="js/dom.js"></script>

</body>
</html>
