<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión - ERK TECH</title>
</head>

<body>

    <header>
        <h1>ERK TECH</h1>
        <p>Plataforma de gestión tecnológica</p>
    </header>

    <main>

        <section>
            <h2>Iniciar sesión</h2>

            <form action="#" method="post">

                <fieldset>

                    <legend>Credenciales de acceso</legend>

                    <label for="correo">
                        Correo electrónico
                    </label>

                    <input
                        type="email"
                        id="correo"
                        name="correo"
                        required
                    >

                    <label for="password">
                        Contraseña
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        required
                        minlength="8"
                    >

                </fieldset>

                <button type="submit">
                    Iniciar sesión
                </button>

            </form>

        </section>

    </main>

    <footer>
        <p>&copy; 2026 ERK TECH. </p>
    </footer>

</body>

</html>
